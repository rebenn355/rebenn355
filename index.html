<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LabInventory — Borrowing System</title>
<style>
*{box-sizing:border-box;margin:0;font-family:Inter,system-ui,sans-serif}body{background:#0b1020;color:#e5e7ef;min-height:100vh}.hide{display:none!important}.mut{color:#8b93b0}
#login{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;animation:fl 12s ease-in-out infinite alternate}
.b1{width:420px;height:420px;background:#6366f1;top:-100px;left:-80px}.b2{width:380px;height:380px;background:#ec4899;bottom:-120px;right:-60px;animation-delay:-4s}.b3{width:300px;height:300px;background:#06b6d4;top:40%;left:55%;animation-delay:-8s}
@keyframes fl{to{transform:translate(60px,-50px) scale(1.2)}}@keyframes up{from{opacity:0;transform:translateY(30px)}}
.glass{position:relative;width:min(400px,92vw);padding:36px;border-radius:24px;background:rgba(255,255,255,.07);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);animation:up .8s both}
.logo{font-size:44px;text-align:center;animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}
.glass h1{text-align:center;margin:8px 0 4px;font-size:24px}.glass p{text-align:center;margin-bottom:22px;font-size:13px}
input,select{width:100%;padding:13px 15px;margin:6px 0 12px;border-radius:12px;border:1px solid #2a3150;background:rgba(10,14,30,.6);color:#fff;font-size:14px;outline:0;transition:.2s}input:focus,select:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f144}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;font-weight:700;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px #6366f155}
.ghost{padding:10px 16px;border:1px solid #2a3150;background:0;color:#cbd2ea;border-radius:10px;cursor:pointer}
#app{display:flex;min-height:100vh}aside{width:230px;background:#0f1530;border-right:1px solid #1d2442;padding:22px 14px;position:sticky;top:0;height:100vh}
aside h2{font-size:18px;margin:0 8px 24px}aside a{display:flex;gap:10px;padding:12px;border-radius:12px;color:#9aa3c4;cursor:pointer;margin-bottom:4px;transition:.2s}aside a:hover,aside a.on{background:linear-gradient(135deg,#6366f133,#ec489922);color:#fff}
main{flex:1;padding:28px;min-width:0}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}header h1{font-size:24px}header .ghost{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:18px}.card{padding:22px;border-radius:18px;background:#121936;border:1px solid #1d2442;border-top:3px solid var(--c);animation:up .6s both;transition:.2s}.card:hover{transform:translateY(-4px)}
.card small{color:#8b93b0}.card b{display:block;font-size:36px;margin-top:6px}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.panel{background:#121936;border:1px solid #1d2442;border-radius:18px;padding:22px;margin-bottom:16px;overflow-x:auto;animation:up .7s both}.panel h3{margin-bottom:14px}
.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #1d2442;font-size:14px}
.bar{display:grid;grid-template-columns:90px 1fr 50px;gap:10px;align-items:center;margin:12px 0;font-size:13px}.bar i{height:10px;border-radius:9px;background:#1d2442;position:relative;overflow:hidden}.bar i:after{content:"";position:absolute;inset:0;width:var(--w);background:linear-gradient(90deg,#6366f1,#ec4899);border-radius:9px;animation:grow 1.2s both}@keyframes grow{from{width:0}}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:#8b93b0;text-align:left;font-weight:500}th,td{padding:12px 10px;border-bottom:1px solid #1d2442;white-space:nowrap}tr:hover td{background:#171f45}
.badge{padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600}.g{background:#10b98122;color:#34d399}.y{background:#f59e0b22;color:#fbbf24}.r{background:#ef444422;color:#f87171}
.sm{padding:6px 11px;border:0;border-radius:8px;cursor:pointer;color:#fff;background:#6366f1;margin-right:4px}.sm.d{background:#ef4444}
.tool{display:flex;gap:10px;margin-bottom:14px}.tool input{margin:0}.tool .btn{width:auto;padding:0 20px;white-space:nowrap}
#modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:9;backdrop-filter:blur(4px)}#modal.on{display:grid}.box{background:#121936;padding:28px;border-radius:20px;width:min(420px,92vw);animation:up .3s both}.box h3{margin-bottom:14px}.act{display:flex;gap:10px;justify-content:flex-end}.act .btn{width:auto;padding:10px 20px}
#toast{position:fixed;right:20px;bottom:20px;padding:14px 20px;border-radius:12px;background:#10b981;color:#fff;transform:translateY(100px);transition:.3s;z-index:20}#toast.on{transform:none}#toast.e{background:#ef4444}
@media(max-width:760px){aside{display:none}main{padding:16px}}
</style></head><body>
<div id="login"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<form class="glass" id="lf"><div class="logo">🧪</div><h1>LabInventory</h1><p class="mut">Laboratory Inventory & Borrowing System</p>
<label class="mut">Username</label><input name="username" placeholder="admin" required autofocus><label class="mut">Password</label><input name="password" type="password" placeholder="••••••••" required><button class="btn">Masuk →</button></form></div>
<div id="app" class="hide"><aside><h2>🧪 LabInventory</h2><nav id="nav"></nav></aside><main><header><h1 id="ttl"></h1><div><span class="mut" id="who"></span> <button class="ghost" onclick="logout()">Logout</button></div></header><div id="view"></div></main></div>
<div id="modal"></div><div id="toast"></div><script src="app.js"></script></body></html>
